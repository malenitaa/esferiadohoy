version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # una versión nueva espera una semana antes de la PR
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (que trae eslint-config-next) todavía no soporta TypeScript 7:
      # el lint se cae. Sacar esta regla cuando eslint-config-next lo soporte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: ["minor", "patch"] # una sola PR semanal para lo chico
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
